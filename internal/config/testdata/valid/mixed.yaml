# Every feature of the §2.3 example: mixed backends, SNI; clusters, tenants and placements are in the directory file.
listener:
  address: ":443"
  domains: ["*.shunt.example.com", "*.s3.example.net"]
  tls:
    cert: /etc/shunt/wildcard.crt
    key: /etc/shunt/wildcard.key
    min_version: "1.3"
    sni:
      "*.s3.example.net": { cert: /etc/shunt/example.crt, key: /etc/shunt/example.key }
admin:
  address: "127.0.0.1:9900"
auth:
  mode: resign
  credentials_file: /etc/shunt/credentials.yaml
  clock_skew: 15m
proxy:
  copy_buffer_bytes: 262144
  idle_timeout: 60s
  metadata_timeout: 30s
  drain_timeout: 30s
directory:
  file: internal/directory/testdata/valid/mixed.yaml
  poll_interval: 2s
telemetry:
  access_log: { enabled: true, path: /var/log/shunt/access.jsonl }
  slow: { ring_size: 100, threshold: 500ms }
features: {}
kill_switches: { xml_rewrite_disable: false }

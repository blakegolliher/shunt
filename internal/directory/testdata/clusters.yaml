# Clusters the directory samples in invalid/ are validated against (a passthrough shunt config).
listener: { address: ":8443", tls: { cert: c.pem, key: k.pem } }
auth: { mode: passthrough }
proxy: { cluster: garage }
clusters:
  garage: { type: s3, scheme: http, region: garage, endpoints: ["127.0.0.1:3900"], credentials: { access_key: GK, secret_ref: env:S } }
  minio: { type: minio, scheme: http, region: r, endpoints: ["127.0.0.1:9000"], credentials: { access_key: GK, secret_ref: env:S } }
  cold: { type: vast, scheme: https, region: r, endpoints: ["10.0.0.1:443"], credentials: { access_key: GK, secret_ref: env:S }, storage_class: GLACIER, access: restore-required }

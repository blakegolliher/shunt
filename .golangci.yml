# P0 linter set (docs/DESIGN.md §7 P0 item 5). No disabled checks without a comment.
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - gocritic
    - bodyclose
    - noctx
    - prealloc
    - unconvert
    - misspell
  settings:
    govet:
      enable-all: true
      disable:
        # fieldalignment reorders structs for padding; config structs are ordered for readability.
        - fieldalignment
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: unused-parameter
        - name: error-strings
        - name: error-return
        - name: errorf
        - name: var-naming
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # hugeParam flags every pass-by-value config struct in tests; benchmarks cover the real cost.
        - hugeParam
      settings:
        rangeValCopy:
          # control.Member is 176 bytes since host and version (ADR-0017) and its directory identity
          # (ADR-0021) joined it; the loops over the fleet copy one per proxy, bounded by proxies,
          # not by requests.
          sizeThreshold: 192
    gosec:
      excludes:
        # G304: check-config opens the file path the operator passed on the command line; that is its job.
        - G304
        # G703: same rationale for the directory file (ADR-0005). Its path comes from the validated
        # config, and shunt opens, replaces, and locks exactly that path plus two fixed suffixes.
        - G703
    misspell:
      locale: US
  exclusions:
    rules:
      # Lifted third-party files (see THIRD_PARTY_NOTICES) keep their upstream doc-comment style and
      # S3 wire field names (UploadId, VersionId); adding sixty comments and renaming fields would be
      # a gratuitous modification of a file we must mark as modified. Every other linter still runs.
      - path: internal/s3/s3response/s3response\.go
        linters: [revive]
      # Same rule for the lifted aws-chunked readers (and their lifted tests): upstream doc-comment
      # style, variable shadowing, and gocritic style stay as written; correctness linters still run.
      - path: internal/sigv4/chunked/(chunk-reader|signed-chunk-reader|unsigned-chunk-reader)(_test)?\.go
        linters: [revive, gocritic]
      - path: internal/sigv4/chunked/(chunk-reader|signed-chunk-reader|unsigned-chunk-reader)(_test)?\.go
        linters: [govet]
        text: "shadow"
      # Tests hand-write HTTP over raw sockets and ignore Close errors on purpose. The
      # production rules (noctx, bodyclose, gosec taint/G104, errcheck on Close, gocritic style,
      # revive unused-parameter) stay on for non-test code.
      - path: _test\.go
        linters: [noctx, bodyclose, gosec, gocritic]
      # test/ holds main packages (s3diff, s3bench) whose job is to send requests to operator-given
      # endpoints; gosec's SSRF taint analysis flags exactly that.
      - path: ^test/
        linters: [gosec]
        text: "G704"
      - path: _test\.go
        linters: [errcheck]
        text: "Close|Fprint"
      - path: _test\.go
        linters: [revive]
        text: "unused-parameter"
      # Table-driven tests shadow err and the response value inside loops and if-statements on
      # purpose; the outer value is never read afterwards. Production code keeps the shadow check.
      - path: _test\.go
        linters: [govet]
        text: "shadow"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# POC-3: one shunt endpoint over Garage and MinIO (resign). Run: make run-mixed
# make run-mixed copies this file to test/e2e/data/shunt-mixed.yaml and resets
# test/e2e/data/directory-mixed.yaml from directory-mixed.yaml with the Garage key filled in:
# clusters are directory state since POC-5.
# VAST joins this run only after `make check-tls-verify` passes (docs/STATUS.md).
listener:
  address: "127.0.0.1:8443"
  domains: ["*.shunt.example.com"]
  tls:
    cert: test/e2e/certs/wildcard.crt
    key: test/e2e/certs/wildcard.key
admin:
  address: "127.0.0.1:9900"
auth:
  mode: resign
  credentials_file: test/e2e/data/credentials.yaml
directory:
  file: test/e2e/data/directory-mixed.yaml
  poll_interval: 1s
proxy:
  copy_buffer_bytes: 262144
  idle_timeout: 60s
  metadata_timeout: 30s
  drain_timeout: 30s
telemetry:
  access_log: { enabled: true, path: test/e2e/data/shunt-mixed.access.jsonl }
  slow: { ring_size: 100, threshold: 500ms }

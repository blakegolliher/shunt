# POC-3: one shunt endpoint over Garage and MinIO (resign). Run: make run-mixed
# up.sh writes test/e2e/data/shunt-mixed.yaml from this file with the Garage key filled in;
# make run-mixed resets test/e2e/data/directory-mixed.yaml from directory-mixed.yaml first.
# VAST joins this run only after `make check-tls-verify` passes (docs/STATUS.md).
listener:
  address: "127.0.0.1:8443"
  domains: ["*.shunt.example.com"]
  tls:
    cert: test/e2e/certs/wildcard.crt
    key: test/e2e/certs/wildcard.key
admin:
  address: "127.0.0.1:9900"
auth:
  mode: resign
  credentials_file: test/e2e/data/credentials.yaml
directory:
  file: test/e2e/data/directory-mixed.yaml
  poll_interval: 1s
proxy:
  copy_buffer_bytes: 262144
  idle_timeout: 60s
  metadata_timeout: 30s
  drain_timeout: 30s
clusters:
  garage:
    type: s3
    scheme: http
    region: garage
    endpoints: ["127.0.0.1:3900"]
    credentials: { access_key: GK_SET_BY_E2E, secret_ref: env:GARAGE_SECRET }
  minio:
    type: minio
    scheme: http
    region: us-east-1
    endpoints: ["127.0.0.1:9000"]
    credentials: { access_key: minioadmin, secret_ref: env:MINIO_SECRET }
telemetry:
  access_log: { enabled: true, path: test/e2e/data/shunt-mixed.access.jsonl }
  slow: { ring_size: 100, threshold: 500ms }

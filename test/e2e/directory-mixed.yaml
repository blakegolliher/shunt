# Seed directory for the POC-3 mixed run (make run-mixed copies it to test/e2e/data/ before every run).
# e2e-a creates buckets on Garage, e2e-b on MinIO. e2e-a/archive is pre-seeded on MinIO so one tenant
# spans both clusters; s3diff creates its backend bucket (e2e-a-seed-archive) if it is missing.
version: 1
clusters:
  garage:
    type: s3
    scheme: http
    region: garage
    endpoints: ["127.0.0.1:3900"]
    credentials: { access_key: GK_SET_BY_E2E, secret_ref: env:GARAGE_SECRET }
    # measured by `make probe BACKEND=garage`: Garage 2.3.0 ignores If-None-Match: * on PUT and
    # If-Match on DELETE
    capabilities: { conditional_write: false, conditional_delete: false }
  minio:
    type: minio
    scheme: http
    region: us-east-1
    endpoints: ["127.0.0.1:9000"]
    credentials: { access_key: minioadmin, secret_ref: env:MINIO_SECRET }
    # measured by `make probe BACKEND=minio` 2026-09-16: If-None-Match: * honored, If-Match on DELETE ignored
    capabilities: { conditional_write: true, conditional_delete: false }
tenants:
  e2e-a: { default_cluster: garage }
  e2e-b: { default_cluster: minio }
placements:
  e2e-a/archive: { state: ACTIVE, primary: minio, names: { minio: e2e-a-seed-archive }, created: 2026-09-15T00:00:00Z }
  e2e-b/archive: { state: ACTIVE, primary: garage, names: { garage: e2e-b-seed-archive }, created: 2026-09-15T00:00:00Z }

# shunt in resign mode fronting one VAST cluster (VAST_ENDPOINT). Run: make run-vast-resign
# The access key is filled from $VAST_ACCESS_KEY_ID into test/e2e/data/directory-vast.yaml, where the
# cluster lives since POC-5 (never committed); the secret is read from $VAST_SECRET_ACCESS_KEY.
#
# TEMPORARY: tls.insecure_skip_verify is on because the cluster serves VAST's factory self-signed
# certificate, which does not cover the endpoint hostname. Remove it once the cluster serves a
# certificate for its hostname, and set tls.ca instead.
listener:
  address: "127.0.0.1:8443"
  domains: ["*.shunt.example.com"]
  tls:
    cert: test/e2e/certs/wildcard.crt
    key: test/e2e/certs/wildcard.key
admin:
  address: "127.0.0.1:9900"
auth:
  mode: resign
  credentials_file: test/e2e/data/credentials.yaml
directory:
  file: test/e2e/data/directory-vast.yaml
proxy:
  copy_buffer_bytes: 262144
  idle_timeout: 60s
  metadata_timeout: 30s
  drain_timeout: 30s
telemetry:
  access_log: { enabled: true, path: test/e2e/data/shunt-vast-resign.access.jsonl }
  slow: { ring_size: 100, threshold: 500ms }

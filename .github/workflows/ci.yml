name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: browser application
        run: make ui ui-lint ui-test
      - name: make all
        run: make all
      - name: go mod tidy is clean
        run: make tidy

  walkthrough:
    # POC-5: docs/walkthrough.md, unattended, on Garage (playing vast01) and MinIO (playing vast02).
    # `shunt verify` reads and writes through shunt from step 4 to step 10; any error fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: tools (aws-cli and jq ship on the runner image)
        run: aws --version && jq --version
      - name: e2e backends
        run: make e2e-up COMPOSE="docker compose"
      - name: make walkthrough
        run: make walkthrough
      - name: make readme-demo
        # The README's hand-run demo, steps 1-14, unattended: the branch must never break it.
        run: make readme-demo
      - name: make fleet
        # Three shunt-control nodes and two proxies sharing nothing: the fence, quorum loss under
        # load, a proxy restarted with the control plane down (ADR-0015, ADR-0016).
        run: make fleet
      - name: logs
        if: failure()
        run: |
          cat test/e2e/data/walkthrough/run/shunt.log || true
          cat test/e2e/data/walkthrough/run/verify.log || true
          cat test/e2e/data/readme-demo/shunt.log || true
          cat test/e2e/data/readme-demo/reader.log || true
          cat test/e2e/data/fleet/c1.log test/e2e/data/fleet/c2.log test/e2e/data/fleet/c3.log test/e2e/data/fleet/a.log test/e2e/data/fleet/b.log test/e2e/data/fleet/writer.log || true
      - name: e2e down
        if: always()
        run: make e2e-down COMPOSE="docker compose"
